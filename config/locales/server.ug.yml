    reply_titles_enabled: "تۇنجى قۇرى يەككە # بەلگىلىك ماۋزۇ بىلەن باشلانغان جاۋابلارنىڭ مۇندەرىجىسىنى كۆرسەت."
    reply_titles_categories: "جاۋابلار مۇندەرىجىسىنى پەقەت بۇ سەھىپىلەردە كۆرسەت. بارلىق سەھىپىلەردە قوزغىتىش ئۈچۈن بوش قالدۇرۇڭ. تارماق سەھىپىلەرنى ئايرىم تاللاش كېرەك. سەھىپە تاللانغاندا شەخسىي ئۇچۇرلاردا مۇندەرىجە كۆرسىتىلمەيدۇ."
