    reply_titles_enabled: "మొదటి పంక్తి ఒకే # గుర్తుతో ఉన్న శీర్షికతో ప్రారంభమయ్యే ప్రత్యుత్తరాల సూచికను చూపించు."
    reply_titles_categories: "ఈ వర్గాలలో మాత్రమే ప్రత్యుత్తరాల సూచికను చూపించు. అన్ని వర్గాలలో ప్రారంభించడానికి ఖాళీగా ఉంచండి. ఉపవర్గాలను విడిగా ఎంచుకోవాలి. వర్గాలను ఎంచుకున్నప్పుడు వ్యక్తిగత సందేశాలలో సూచిక కనిపించదు."
